name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate-compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy env example
        run: cp .env.example .env
      - name: Validate docker compose config
        run: docker compose config --quiet

  build-api:
    name: Build integration-api (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect pom.xml
        id: detect
        run: |
          if [ -f services/integration-api/pom.xml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::pom.xml todavia no existe; build-api se ejecutara cuando este disponible."
          fi
      - name: Set up Java
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # HU-06.2 (IUDCYGI-38): se quita el bypass -DskipTests del build. mvn verify
      # ahora corre todos los unit tests via surefire + ejecuta JaCoCo (coverage
      # report en target/site/jacoco/jacoco.xml). Los ITs con Testcontainers
      # siguen gateados (skipITs=true por default) y se materializarán con un
      # job CI dedicado en HU-06.4.
      - name: Build + unit tests + JaCoCo coverage
        if: steps.detect.outputs.exists == 'true'
        working-directory: services/integration-api
        run: ./mvnw -B verify
      - name: Upload JaCoCo coverage report
        if: steps.detect.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: services/integration-api/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

  lint-crm:
    name: Lint CRM (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect package.json
        id: detect
        run: |
          if [ -f services/crm-frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json todavia no existe; lint-crm se ejecutara cuando este disponible."
          fi
      - name: Set up Node
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/crm-frontend/package-lock.json
      - name: Install
        if: steps.detect.outputs.exists == 'true'
        working-directory: services/crm-frontend
        run: npm ci
      - name: Lint
        if: steps.detect.outputs.exists == 'true'
        working-directory: services/crm-frontend
        run: npm run lint

  test-crm:
    name: Test CRM (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect package.json
        id: detect
        run: |
          if [ -f services/crm-frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json todavia no existe; test-crm se ejecutara cuando este disponible."
          fi
      - name: Set up Node
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/crm-frontend/package-lock.json
      - name: Install
        if: steps.detect.outputs.exists == 'true'
        working-directory: services/crm-frontend
        run: npm ci
      # HU-06.3 (IUDCYGI-39): vitest con provider v8 emite lcov + html + json-summary
      # para Sonar y para revisión humana. Thresholds en vite.config.ts.
      - name: Run tests with coverage
        if: steps.detect.outputs.exists == 'true'
        working-directory: services/crm-frontend
        run: npm run test:coverage
      - name: Upload Vitest coverage report
        if: steps.detect.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: services/crm-frontend/coverage/
          if-no-files-found: warn
          retention-days: 7

  e2e-crm:
    name: E2E CRM (Playwright static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect package.json
        id: detect
        run: |
          if [ -f services/crm-frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/crm-frontend/package-lock.json
      - name: Install npm deps
        if: steps.detect.outputs.exists == 'true'
        working-directory: services/crm-frontend
        run: npm ci
      - name: Cache Playwright browsers
        if: steps.detect.outputs.exists == 'true'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('services/crm-frontend/package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.detect.outputs.exists == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: services/crm-frontend
        run: npx playwright install chromium --with-deps
      - name: Install Playwright system deps (cache hit)
        if: steps.detect.outputs.exists == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: services/crm-frontend
        run: npx playwright install-deps chromium
      - name: Build CRM (for preview server)
        if: steps.detect.outputs.exists == 'true'
        working-directory: services/crm-frontend
        run: npm run build
      - name: Run Playwright static suite
        if: steps.detect.outputs.exists == 'true'
        working-directory: services/crm-frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always() && steps.detect.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/.report/
          if-no-files-found: warn
          retention-days: 7
