# docker-compose.dev.yml — Overrides para desarrollo
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Diferencias respecto al perfil prod:
#   - SIP plano en 5060/udp para softphones de prueba sin TLS.
#   - Healthchecks con start_period más generoso.
#   - Hot-reload de configs (mounts adicionales).
#   - Puertos de DB y otros remapeados para evitar choques con servicios nativos
#     comunes en Windows/Linux dev (MySQL/MariaDB en 3306, etc.).

services:

  db:
    # En dev exponemos en 13306 host -> 3306 container para no chocar con un
    # mysqld nativo que el desarrollador pueda tener corriendo en su SO.
    # En la red ucgi-net los demás servicios siguen llegando por db:3306.
    ports:
      - "13306:3306"

  asterisk:
    # En dev hacemos bind-mount por archivo individual para poder editar configs
    # y aplicar con `asterisk -rx "pjsip reload"` sin rebuild.
    # NO bind-monto /etc/asterisk completo porque taparía los samples (voicemail.conf,
    # indications.conf, etc.) que Asterisk requiere para arrancar.
    volumes:
      - ./infra/asterisk/configs/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./infra/asterisk/configs/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./infra/asterisk/configs/http.conf:/etc/asterisk/http.conf:ro
      - ./infra/asterisk/configs/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./infra/asterisk/configs/modules.conf:/etc/asterisk/modules.conf:ro
      - ./infra/asterisk/configs/logger.conf:/etc/asterisk/logger.conf:ro

  integration-api:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      LOGGING_LEVEL_COM_UCGI: DEBUG

  crm:
    environment:
      NODE_ENV: development

  nginx:
    # En dev no forzamos HSTS para evitar problemas con autofirmados.
    environment:
      - NGINX_DEV_MODE=1
