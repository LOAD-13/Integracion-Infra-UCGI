# docker-compose.yml — Orquestación del entorno UCGI
# Esqueleto inicial del Sprint 1. Cada servicio se irá afinando en sus HUs.

services:

  # ===== Base de datos =====
  db:
    image: mariadb:10.6
    container_name: ucgi-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
    volumes:
      - db-data:/var/lib/mysql
      - ./infra/mariadb/init:/docker-entrypoint-initdb.d:ro
    # NOTA: el puerto 3306 NO se expone al host en el perfil prod por seguridad.
    # La DB solo es alcanzable desde la red ucgi-net por el resto de servicios.
    # En dev, docker-compose.dev.yml mapea 13306 (host) -> 3306 (container)
    # para poder conectarse con clientes locales (DBeaver, mysql cli).
    networks:
      - ucgi-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MARIADB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===== PostgreSQL dedicado a midPoint =====
  # Decisión: midPoint 4.4 dropeó las DDL de MariaDB en la imagen oficial; mantenemos
  # MariaDB para el CRM (que es código nuestro) y usamos PostgreSQL solo para el
  # repository de midPoint (que es la opción que evolveum sostiene oficialmente).
  midpoint-db:
    image: postgres:15-alpine
    container_name: ucgi-midpoint-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MP_DB_USER}
      POSTGRES_PASSWORD: ${MP_DB_PASSWORD}
      POSTGRES_DB: midpoint
    volumes:
      - midpoint-pg-data:/var/lib/postgresql/data
    networks:
      - ucgi-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MP_DB_USER} -d midpoint"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===== midPoint (IAM) =====
  midpoint:
    build:
      context: ./infra/midpoint
      dockerfile: Dockerfile
    image: ucgi/midpoint:4.4.11
    container_name: ucgi-midpoint
    restart: unless-stopped
    environment:
      # JDBC: apunta al servicio midpoint-db (PostgreSQL) en la red ucgi-net.
      MP_SET_midpoint_repository_jdbcUrl: jdbc:postgresql://midpoint-db:5432/midpoint
      MP_SET_midpoint_repository_jdbcUsername: ${MP_DB_USER}
      MP_SET_midpoint_repository_jdbcPassword: ${MP_DB_PASSWORD}
      MP_SET_midpoint_repository_database: postgresql
      MP_SET_midpoint_repository_hibernateHbm2ddl: none
      # Password del usuario administrator generado en el primer bootstrap.
      MP_SET_midpoint_administrator_initialPassword: ${MP_ADMIN_PASSWORD}
    volumes:
      - midpoint-home:/opt/midpoint/var
      - ./infra/midpoint/resources:/opt/midpoint/var/import-on-startup:ro
    ports:
      - "8080:8080"
    networks:
      - ucgi-net
    depends_on:
      db:
        condition: service_healthy
      midpoint-db:
        condition: service_healthy
    healthcheck:
      # midPoint 4.7 no expone /actuator/health por defecto, usamos la pagina de login.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/midpoint/login"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

  # ===== MikoPBX (PBX con GUI + REST API) =====
  # Reemplaza al contenedor Asterisk custom de S2 desde la decisión 2026-06-19
  # (HU-02.6). MikoPBX es Asterisk 20 sobre Alpine con GUI web, REST API y
  # SQLite interno. La provisión de extensiones la hace integration-api vía
  # REST (HU-03.8). infra/asterisk/ queda en el repo como evidencia histórica.
  mikopbx:
    image: mikopbx/mikopbx:2026.2.118
    container_name: ucgi-mikopbx
    restart: unless-stopped
    environment:
      WEBHTTPPORT: 80
      WEBHTTPSPORT: 443
      SSHPORT: 22
      TZ: ${TZ}
    volumes:
      - mikopbx-data:/storage/usbdisk1     # configs, recordings, SQLite DB
      - mikopbx-confdb:/cf/conf            # config persistente del sistema
    ports:
      - "8090:80"                           # GUI HTTP (host:8090)
      - "8443:443"                          # GUI HTTPS (host:8443)
      - "5060:5060/udp"                     # SIP UDP
      - "5060:5060/tcp"                     # SIP TCP
      - "5061:5061/tcp"                     # SIP-TLS (HU-07.2)
      - "8088:8088/tcp"                     # WS para SIP.js
      - "8089:8089/tcp"                     # WSS para SIP.js (HU-07.2)
      - "10000-10200:10000-10200/udp"       # RTP (~100 llamadas concurrentes)
    networks:
      - ucgi-net
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ===== Microservicio de integración (Spring Boot) =====
  integration-api:
    build:
      context: ./services/integration-api
      dockerfile: Dockerfile
    container_name: ucgi-integration-api
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}
      MIDPOINT_BASE_URL: ${MIDPOINT_BASE_URL}
      MIDPOINT_ADMIN_USER: ${MIDPOINT_ADMIN_USER}
      MIDPOINT_ADMIN_PASSWORD: ${MIDPOINT_ADMIN_PASSWORD}
      ASTERISK_AMI_HOST: ${ASTERISK_AMI_HOST}
      ASTERISK_AMI_PORT: ${ASTERISK_AMI_PORT}
      ASTERISK_AMI_USER: ${ASTERISK_AMI_USER}
      ASTERISK_AMI_SECRET: ${ASTERISK_AMI_SECRET}
      ASTERISK_CONFIG_PATH: ${ASTERISK_CONFIG_PATH}
      MIKOPBX_HOST: ${MIKOPBX_HOST}
      MIKOPBX_PORT: ${MIKOPBX_PORT}
      MIKOPBX_ADMIN_USER: ${MIKOPBX_ADMIN_USER}
      MIKOPBX_ADMIN_PASSWORD: ${MIKOPBX_ADMIN_PASSWORD}
    ports:
      - "8081:8081"
    networks:
      - ucgi-net
    depends_on:
      db:
        condition: service_healthy
      midpoint:
        condition: service_started
      mikopbx:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 6

  # ===== CRM (React) =====
  crm:
    build:
      context: ./services/crm-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_SIP_WS_URL: ${VITE_SIP_WS_URL}
        VITE_SIP_DOMAIN: ${VITE_SIP_DOMAIN}
    container_name: ucgi-crm
    restart: unless-stopped
    networks:
      - ucgi-net
    depends_on:
      - integration-api

  # ===== Nginx reverse proxy + TLS =====
  # Termina TLS en :443 y proxya a midpoint, integration-api y crm.
  # NOTA depends_on: en S2 solo dependemos de midpoint (los otros aún sin
  # Dockerfile en S3). nginx levanta sin esos upstreams y devuelve 502 si se
  # accede a /api o /; el smoke test se hace contra /healthz y /midpoint.
  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    image: ucgi/nginx:1.27
    container_name: ucgi-nginx
    restart: unless-stopped
    volumes:
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ucgi-net
    depends_on:
      midpoint:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--insecure", "https://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  # ===== SonarQube =====
  sonar:
    image: sonarqube:lts-community
    container_name: ucgi-sonar
    restart: unless-stopped
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-logs:/opt/sonarqube/logs
      - sonar-extensions:/opt/sonarqube/extensions
    ports:
      - "9000:9000"
    networks:
      - ucgi-net
    depends_on:
      - sonar-db

  sonar-db:
    image: postgres:15-alpine
    container_name: ucgi-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar-pg-data:/var/lib/postgresql/data
    networks:
      - ucgi-net

  # ===== Prometheus =====
  prometheus:
    image: prom/prometheus:latest
    container_name: ucgi-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - "9090:9090"
    networks:
      - ucgi-net

  # ===== Grafana =====
  grafana:
    image: grafana/grafana:latest
    container_name: ucgi-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - ucgi-net
    depends_on:
      - prometheus

  # ===== ucgi-shaper (HU-08.5 versión mínima — IUDCYGI-164) =====
  # Stub Flask que expone /status con el ancho de banda configurado por env.
  # Sirve para que el `integration-api` ejerza el flujo HU-03.7 (polling
  # cada 10 s, decisión de códec) sin depender todavía de `tc qdisc tbf`.
  # La versión real (con iproute2 aplicando límites efectivos + métricas
  # reales) entra en Sprint 4 — ver docs/notas-tecnicas/.
  shaper:
    build:
      context: ./infra/shaper
      dockerfile: Dockerfile
    image: ucgi/shaper:0.1.0-mock
    container_name: ucgi-shaper
    restart: unless-stopped
    environment:
      MOCK_BANDWIDTH_MBPS: ${SHAPER_MOCK_BANDWIDTH_MBPS:-50}
      MOCK_QDISC_ACTIVE: ${SHAPER_MOCK_QDISC_ACTIVE:-false}
    ports:
      - "9100:9100"
    networks:
      - ucgi-net
      - ucgi-backend

# ===== Networking =====
# Red bridge dedicada para todo el stack UCGI. Todos los servicios joineen
# explícitamente ucgi-net y ninguno usa la red `default` de compose.
# Aporta:
#   - Aislamiento (ISO 27001 A.13.1.1): solo se exponen al host los puertos
#     declarados en cada servicio; el resto del tráfico inter-service nunca
#     toca la red del host.
#   - Resolución por nombre: dentro de la red, "db", "asterisk", "midpoint",
#     etc. se resuelven al hostname del servicio sin DNS externo.
#   - Subnet propia (172.18.0.0/16 por defecto en Docker), no compartida con
#     otros proyectos del developer.
networks:
  ucgi-net:
    name: ucgi-net
    driver: bridge
  # ============================================================
  # Segmentación HU-07.8 (versión mínima — IUDCYGI-162)
  # ============================================================
  # Declaramos las 3 sub-networks que la HU-07.8 completa va a usar para
  # aislar capas (ISO 27001 A.13.1.1). En esta versión mínima los servicios
  # existentes siguen sobre `ucgi-net` y solo el `shaper` toma la network
  # `ucgi-backend` — refactor de membresías llega con HU-07.8 versión
  # completa en Sprint 4. Tenerlas declaradas evita romper el compose en
  # cuanto se haga el refactor real.
  ucgi-frontend:
    name: ucgi-frontend
    driver: bridge
  ucgi-voip:
    name: ucgi-voip
    driver: bridge
  ucgi-backend:
    name: ucgi-backend
    driver: bridge

# ===== Volúmenes nombrados =====
# Persistencia de datos entre `down`/`up`. Mantener TODOS los servicios con
# estado persistente apuntando a un named volume — bind mounts solo para
# config-as-code (read-only desde el repo).
#
# Convención de naming: <recurso>-<rol>. El proyecto compose les añade el
# prefijo "ucgi_" automáticamente (ver `docker volume ls`).
#
# Para vaciar TODO (datos del lab): `docker compose down -v` o
# `docker volume rm $(docker volume ls -q --filter name=ucgi_)`.
volumes:
  db-data:           # MariaDB — datos del CRM (crm.*)
  midpoint-home:     # midPoint — keystore, configuración runtime
  midpoint-pg-data:  # PostgreSQL del repository de midPoint
  mikopbx-data:      # MikoPBX — /storage/usbdisk1 (recordings, SQLite, configs runtime)
  mikopbx-confdb:    # MikoPBX — /cf/conf (config persistente del sistema)
  sonar-data:        # SonarQube — base de análisis
  sonar-logs:        # SonarQube — logs runtime
  sonar-extensions:  # SonarQube — plugins instalados
  sonar-pg-data:     # PostgreSQL de SonarQube
  prometheus-data:   # Prometheus — TSDB (retención 7d)
  grafana-data:      # Grafana — dashboards, usuarios, datasources
