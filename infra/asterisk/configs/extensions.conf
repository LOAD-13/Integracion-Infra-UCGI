;
; extensions.conf — dialplan
;
; Contexto único [internal] usado por todos los endpoints generados
; desde pjsip.conf.template (EP-05). Rango 100-199 reservado para agentes.
;

[general]
static = yes
writeprotect = no
clearglobalvars = no

[globals]

;------------------------------------------------------------------------------
; Contexto interno — llamadas agente ↔ agente
;------------------------------------------------------------------------------
[internal]
; Marcado por extensión 1XX
exten => _1XX,1,NoOp(Llamada interna ${CALLERID(num)} -> ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

; Echo test para validar audio end-to-end del softphone WebRTC.
exten => 600,1,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; Fallback: extensión no encontrada
exten => _X.,1,NoOp(Extensión no encontrada: ${EXTEN})
 same => n,Playback(invalid)
 same => n,Hangup()
