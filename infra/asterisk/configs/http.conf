;
; http.conf — servidor HTTP interno de Asterisk
;
; Habilita el listener WebSocket en 8088 (ws://) para que SIP.js pueda
; conectarse desde el navegador. El listener WSS (8089) y TLS se habilitan
; en HU-07.2 cuando existan certificados firmados en /etc/asterisk/tls/.
;

[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088
prefix =
sessionlimit = 100
sessiontimeout = 30000
session_keep_alive = 15000
sessioninactivetimeout = 30000

; --- TLS / WSS — deshabilitado en S2, se activa en HU-07.2 (S4) ---
; tlsenable = yes
; tlsbindaddr = 0.0.0.0:8089
; tlscertfile = /etc/asterisk/tls/asterisk.pem
; tlsprivatekey = /etc/asterisk/tls/asterisk.key
