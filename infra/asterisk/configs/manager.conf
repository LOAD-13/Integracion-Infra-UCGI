;
; manager.conf — Asterisk Manager Interface (AMI)
;
; Habilitado para que el microservicio `integration-api` pueda ejecutar
; `pjsip reload` tras regenerar /etc/asterisk/dynamic.d/pjsip.conf.
;
; Sólo accesible desde la red docker `ucgi-net` (172.18.0.0/16 — subnet
; que docker asigna por defecto al primer bridge dedicado del compose).
; NO se expone al host: el puerto 5038 no aparece en docker-compose.yml.
;
; Lab academic — el secret está hardcodeado aquí porque manager.conf se
; bakea en la imagen. En un despliegue real se rotaría usando un
; entrypoint que reemplaza un placeholder con la env var.
;

[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
displayconnects = yes
authtimeout = 30
timestampevents = yes

[ucgi-ami]
secret = changeme-ami
deny = 0.0.0.0/0.0.0.0
permit = 172.16.0.0/12
permit = 127.0.0.1/255.255.255.0
read = system,call,config,user,verbose
write = system,call,config,originate,reload
