;
; modules.conf — qué módulos carga Asterisk al arrancar
;
; Estrategia: autoload + lista explícita de módulos críticos para PJSIP/WebRTC/SRTP.
; chan_sip legacy queda deshabilitado para evitar conflictos con chan_pjsip.
;

[modules]
autoload = yes

; res_crypto y res_srtp deben preloadearse para que pjsip pueda negociar DTLS+SRTP.
preload => res_crypto.so
preload => res_srtp.so

; PJSIP stack
load => res_pjsip.so
load => res_pjsip_session.so
load => chan_pjsip.so

; WebSocket para WebRTC (transporte ws/wss usado por SIP.js)
load => res_http_websocket.so
load => res_pjsip_transport_websocket.so

; Codec Opus (preferido para WebRTC)
load => codec_opus.so

; Legacy / no necesarios — deshabilitados
noload => chan_sip.so
noload => chan_mgcp.so
noload => chan_skinny.so
noload => res_pjsip_publish_asterisk.so

[global]
