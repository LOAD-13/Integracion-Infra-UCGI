;
; pjsip.conf — configuración inicial del stack PJSIP
;
; HU-02.3 deja únicamente los transports declarados (sin endpoints).
; Los endpoints/aors/auth dinámicos los provisiona el microservicio Java
; (EP-05) regenerando este archivo desde pjsip.conf.template y recargando
; Asterisk vía AMI.
;

;------------------------------------------------------------------------------
; Transports
;------------------------------------------------------------------------------

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0:8088

; --- TLS / WSS — comentados hasta HU-07.2 (certs en /etc/asterisk/tls/) ---
;[transport-tls]
;type = transport
;protocol = tls
;bind = 0.0.0.0:5061
;cert_file = /etc/asterisk/tls/asterisk.pem
;priv_key_file = /etc/asterisk/tls/asterisk.key
;method = tlsv1_2

;[transport-wss]
;type = transport
;protocol = wss
;bind = 0.0.0.0:8089
;cert_file = /etc/asterisk/tls/asterisk.pem
;priv_key_file = /etc/asterisk/tls/asterisk.key
