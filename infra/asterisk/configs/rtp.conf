;
; rtp.conf — rango de puertos RTP usados por las llamadas
;
; El rango 10000-10100 está alineado con docker-compose (exposición UDP).
; strictrtp + icesupport son requeridos para WebRTC.
;

[general]
rtpstart = 10000
rtpend = 10100
strictrtp = yes
icesupport = yes
; STUN público de Google solo para desarrollo. En producción se usaría
; un STUN propio o se documentaría como dependencia externa.
stunaddr = stun.l.google.com:19302
