# nginx.conf — reverse proxy + TLS termination del stack UCGI
#
# Layout de rutas:
#   /            → CRM React (servicio crm:3000)         [HU-04.x]
#   /api/        → integration-api Spring Boot (8081)    [HU-03.x]
#   /midpoint/   → midPoint UI (8080)                    [HU-02.2 ✓]
#   /ws          → MikoPBX WebSocket (8088)              [HU-02.6 ✓ — SIP.js HU-04.2]
#   /healthz     → endpoint local "ok" para healthcheck del propio nginx
#
# Seguridad (ISO 27001 A.8.24 / A.5.15 / A.13.1.1):
#   - TLS 1.2 y 1.3 únicamente, ciphers HIGH.
#   - HSTS con max-age=1 año.
#   - Redirect 301 de :80 a :443.
#   - Security headers: X-Content-Type-Options, X-Frame-Options, Referrer-Policy.
#   - server_tokens off — no leakeamos versión de Nginx.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    # DNS resolver de Docker (127.0.0.11) para que los upstreams se resuelvan
    # perezosamente — así nginx arranca aunque crm/integration-api aún no
    # tengan Dockerfile (los terminamos en S3).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # WebSocket upgrade map: usado en /ws para Asterisk.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ============================================================
    # :80 — HTTP plano. Único job: redirigir a HTTPS.
    # ============================================================
    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ============================================================
    # :443 — HTTPS principal.
    # ============================================================
    server {
        listen              443 ssl;
        listen              [::]:443 ssl;
        http2               on;
        server_name         _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # TLS 1.2 + 1.3 únicamente (corta SSLv2/3, TLS 1.0/1.1 ya inseguros).
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS — 1 año + subdominios.
        # En el lab los certs son autofirmados; el browser solo respeta HSTS si
        # la CA está confiable. Igual lo dejamos puesto: la primera vez que se
        # use un cert real (Let's Encrypt en prod), HSTS ya estará activo.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Hardening de headers (defensa en profundidad).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ---------- Endpoint healthcheck local ----------
        # Nota: cualquier `add_header` en este location ocultaría los headers
        # heredados del server (gotcha de nginx). Usamos `default_type` que
        # no resetea la pila de add_header.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ---------- WebSocket SIP.js → MikoPBX ----------
        # Usado por el softphone WebRTC (HU-04.2) sobre wss://host/ws.
        # Tras el pivote HU-02.6 (2026-06-19) el upstream es `mikopbx` (Alpine +
        # Asterisk 20 + GUI) en lugar del Asterisk custom eliminado.
        location /ws {
            set $upstream_mikopbx http://mikopbx:8088/ws;
            proxy_pass $upstream_mikopbx;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---------- /api/ → integration-api (Spring Boot) ----------
        # IMPORTANTE: el integration-api expone sus endpoints en /api/v1/...
        # (controllers anotados con @RequestMapping("/api/v1/...")). NO debemos
        # hacer strip del prefijo `/api/` aquí — pasamos el URI tal cual al
        # backend usando `proxy_pass` SIN URI fija y SIN trailing slash. Si
        # cambia a `http://integration-api:8081/` el prefijo se strippea y los
        # endpoints devuelven 401 "Token ausente" porque caen fuera del
        # SecurityConfig.permitAll().
        location /api/ {
            proxy_pass http://integration-api:8081;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- /midpoint/ → midPoint ----------
        location /midpoint/ {
            set $upstream_midpoint http://midpoint:8080;
            proxy_pass $upstream_midpoint;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # midPoint maneja sesiones largas con polling; subimos timeout.
            proxy_read_timeout 300s;
        }

        # ---------- / → CRM React (catch-all al final) ----------
        location / {
            set $upstream_crm http://crm:3000;
            proxy_pass $upstream_crm;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
