# nginx-spa.conf — Sirve el SPA estático del CRM dentro del contenedor `crm`.
# El reverse proxy del lab (infra/nginx) llega por http://crm:3000 y delega
# todas las rutas no estáticas al fallback SPA (`try_files`).

server {
    listen      3000;
    listen      [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets versionados de Vite (hash en el nombre) → caché agresiva.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — cualquier ruta cliente vuelve a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
