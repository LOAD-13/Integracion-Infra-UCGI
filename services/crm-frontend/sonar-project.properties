# HU-06.1 (IUDCYGI-37) — análisis SonarQube del CRM React/TypeScript.
# Lanzar desde la raíz de services/crm-frontend:
#   npm run test:coverage
#   make sonar-crm SONAR_TOKEN=<token>
# o directamente con sonar-scanner instalado:
#   sonar-scanner \
#     -Dsonar.host.url=http://localhost:9000 \
#     -Dsonar.login=$SONAR_TOKEN

sonar.projectKey=ucgi-crm-frontend
sonar.projectName=UCGI CRM Frontend
sonar.projectVersion=0.1.0
sonar.sources=src
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/tests/**,src/**/*.d.ts,src/main.tsx,src/setupTests.ts
sonar.tests=src/tests,src/**/__tests__
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.tsx,src/setupTests.ts,src/tests/**,src/**/*.test.ts,src/**/*.test.tsx,src/**/*.d.ts
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json
