# HU-06.1 (IUDCYGI-37) — análisis SonarQube del microservicio Java.
# Lanzar desde la raíz de services/integration-api:
#   make sonar-api SONAR_TOKEN=<token>
# o directamente:
#   ./mvnw -B verify sonar:sonar \
#     -Dsonar.host.url=http://localhost:9000 \
#     -Dsonar.login=$SONAR_TOKEN

sonar.projectKey=ucgi-integration-api
sonar.projectName=UCGI Integration API
sonar.projectVersion=0.1.0
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.junit.reportPaths=target/surefire-reports,target/failsafe-reports
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.exclusions=src/main/java/com/ucgi/integrationapi/IntegrationApiApplication.java,**/dto/**,**/entity/**,**/config/**
sonar.coverage.exclusions=src/main/java/com/ucgi/integrationapi/IntegrationApiApplication.java,**/dto/**,**/entity/**,**/config/**
sonar.java.source=17
sonar.sourceEncoding=UTF-8
