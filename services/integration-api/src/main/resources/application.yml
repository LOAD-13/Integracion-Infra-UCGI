spring:
  application:
    name: integration-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # HU-03.5 reactivará SecurityAutoConfiguration cuando llegue el filtro JWT.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://db:3306/crm}
    username: ${SPRING_DATASOURCE_USERNAME:ucgi_app}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme-app}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      pool-name: ucgi-api-pool

  jpa:
    open-in-view: false
    # validate: las tablas las crea infra/mariadb/init/*.sql; Hibernate solo verifica.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false

server:
  port: 8081
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Microservicio intermediario UCGI (midPoint ↔ Asterisk)
    version: 0.1.0-SNAPSHOT

logging:
  level:
    root: INFO
    com.ucgi.integrationapi: DEBUG
    org.hibernate.SQL: INFO
